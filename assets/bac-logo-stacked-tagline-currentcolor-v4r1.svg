  <title id="title">Build a CubeSat Logo Stacked Tagline v4r1</title>
  <desc id="desc">Build a CubeSat (BAC) brand logo stacked tagline, version 4r1. Stacked lockup: symbol centered above the wordmark at 52.5% of the cube height, gap 100; Nunito 500, tracking -0.03 em, outlined. Tagline "SPACE FOR EVERYONE" in IBM Plex Mono Medium, tracking 0.286 em, sized to 72% of the wordmark's width and centered under it, rules filling the rest, outlined. Copyright 2026 nihil.space GmbH. A BAC Mark: not covered by any open license, use governed by the BAC Trademark Policy (hello@buildacubesat.space).</desc>
