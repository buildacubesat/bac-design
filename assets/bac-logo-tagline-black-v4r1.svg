  <title id="title">Build a CubeSat Logo Tagline v4r1</title>
  <desc id="desc">Build a CubeSat (BAC) brand logo tagline, version 4r1. Horizontal lockup: symbol with the wordmark at 70% of the cube height, gap 70; Nunito 350, tracking -0.03 em, outlined. Tagline "SPACE FOR EVERYONE" in IBM Plex Mono, tracking 0.286 em, sized to 72% of the wordmark's width and centred under it, rules filling the rest, outlined. Copyright 2026 nihil.space GmbH. A BAC Mark: not covered by any open licence, use governed by the BAC Trademark Policy (hello@buildacubesat.space).</desc>
